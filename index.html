<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Talaan – Sales invoicing prototype (RMC 77-2024 formats)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="mobile-header noprint">
      <button
        class="hamburger-btn"
        id="mobileMenuBtn"
        aria-label="Open navigation menu"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
        >
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="mobile-brand">Talaan</div>
      <div class="mobile-branch" id="mobileBranchBox"></div>
    </div>

    <div
      class="pull-tab noprint"
      id="pullTab"
      aria-label="Pull to open menu"
      title="Pull or tap to open menu"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </div>

    <div class="nav-overlay noprint" id="navOverlay"></div>

    <div class="app">
      <nav class="side noprint" aria-label="Main">
        <div class="side-head">
          <div class="logo">Talaan</div>
          <button
            class="sidebar-toggle-btn"
            id="sidebarToggleBtn"
            title="Collapse sidebar"
            data-act="togglesidebar"
          >
            <svg
              class="icon-collapse"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
        </div>
        <div class="co" id="coBox"></div>
        <div class="userbox" id="userBox"></div>
        <button class="navbtn" data-go="list">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                ></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline></svg></span
            ><span class="nav-label">Invoices</span></span
          ><span class="count" id="navCount" hidden></span>
        </button>
        <button class="navbtn" data-go="new">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                ></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line></svg></span
            ><span class="nav-label">New invoice</span></span
          >
        </button>
        <button class="navbtn" data-go="tally">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line></svg></span
            ><span class="nav-label">Small sales tally</span></span
          >
        </button>
        <button class="navbtn" data-go="register">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
                ></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line></svg></span
            ><span class="nav-label">Discount register</span></span
          >
        </button>
        <button class="navbtn" data-go="credits">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line></svg></span
            ><span class="nav-label">Credit memos</span></span
          ><span class="count" id="cmCount" hidden></span>
        </button>
        <button class="navbtn" data-go="corrections">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                ></path>
                <path
                  d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                ></path></svg></span
            ><span class="nav-label">Correction notices</span></span
          ><span class="count" id="crCount" hidden></span>
        </button>
        <button class="navbtn" data-go="receipts">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"
                ></path>
                <line x1="8" y1="8" x2="16" y2="8"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
                <line x1="8" y1="16" x2="12" y2="16"></line></svg></span
            ><span class="nav-label">Receipts register</span></span
          >
        </button>
        <button class="navbtn" data-go="aging">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline></svg></span
            ><span class="nav-label">Receivables aging</span></span
          >
        </button>
        <button class="navbtn" data-go="customers">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span
            ><span class="nav-label">Customers</span></span
          >
        </button>
        <button class="navbtn" data-go="products">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
                ></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line></svg></span
            ><span class="nav-label">Products and stock</span></span
          >
        </button>
        <button class="navbtn" data-go="verify">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span
            ><span class="nav-label">Verify a document</span></span
          >
        </button>
        <button class="navbtn" data-go="ready">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                ></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                <polyline points="9 11 12 14 22 4"></polyline></svg></span
            ><span class="nav-label">RMC 98-2026 readiness</span></span
          >
        </button>
        <button class="navbtn" data-go="log">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4.9 19.1C1.7 15.9 1.7 10.8 4.9 7.5"></path>
                <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
                <circle cx="12" cy="12" r="2"></circle>
                <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
                <path d="M19.1 4.9c3.2 3.2 3.2 8.4 0 11.6"></path></svg></span
            ><span class="nav-label">EIS transmission log</span></span
          >
        </button>
        <button class="navbtn" data-go="settings">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                <line x1="9" y1="6" x2="9.01" y2="6"></line>
                <line x1="15" y1="6" x2="15.01" y2="6"></line>
                <line x1="9" y1="10" x2="9.01" y2="10"></line>
                <line x1="15" y1="10" x2="15.01" y2="10"></line>
                <line x1="9" y1="14" x2="9.01" y2="14"></line>
                <line x1="15" y1="14" x2="15.01" y2="14"></line>
                <path d="M9 18h6v4H9z"></path></svg></span
            ><span class="nav-label">Company, PTI and permits</span></span
          >
        </button>
        <button class="navbtn" data-go="acct">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line></svg></span
            ><span class="nav-label">Accounting export</span></span
          >
        </button>
        <button class="navbtn" data-go="fx">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                <line x1="12" y1="6" x2="12" y2="18"></line></svg></span
            ><span class="nav-label">Foreign currency</span></span
          >
        </button>
        <button class="navbtn" data-go="branches">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle></svg></span
            ><span class="nav-label">Branches</span></span
          >
        </button>
        <button class="navbtn" data-go="users">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                ></path></svg></span
            ><span class="nav-label">Users and security</span></span
          >
        </button>
        <button class="navbtn" data-go="design">
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                <path d="M2 2l7.586 7.586"></path>
                <circle cx="11" cy="11" r="2"></circle></svg></span
            ><span class="nav-label">Invoice design</span></span
          >
        </button>
        <button
          class="navbtn"
          data-go="provider"
          style="
            margin-top: 14px;
            border-top: 1px solid var(--line);
            border-radius: 0;
            padding-top: 14px;
          "
        >
          <span class="nav-content"
            ><span class="nav-icon"
              ><svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span
            ><span class="nav-label">Provider console</span></span
          >
        </button>
      </nav>
      <main id="main"></main>
    </div>
    <div id="helpRoot"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
